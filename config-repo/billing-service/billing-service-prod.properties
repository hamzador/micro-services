discovery.params.prod.x1=prodX1
discovery.params.prod.x2=prodX2


spring.datasource.url=jdbc:h2:mem:bills-prod-db
spring.h2.console.enabled=true


#search for config server/service
spring.cloud.config.enabled=false

#search discovery service
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


#pour afficher tout les options de actuator /beans /caches, .../refresh
management.endpoints.web.exposure.include=*

